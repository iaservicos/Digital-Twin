<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <defs>
    
    <linearGradient id="plusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>

    <radialGradient id="ambientGlowLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#0891b2" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0" />
    </radialGradient>

    <filter id="neonGlowLight" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

  </defs>

  <circle cx="452" cy="100" r="95" fill="url(#ambientGlowLight)" />

  <text x="300" y="125" text-anchor="middle">
    <tspan fill="#0f172a" 
           font-family="'Arial Black', Impact, 'Montserrat Black', 'Segoe UI Black', sans-serif" 
           font-weight="900" 
           font-size="74" 
           letter-spacing="-0.04em">BRILHA</tspan>
    <tspan dx="10" dy="-2"
           fill="url(#plusGrad)" 
           font-family="'Arial Black', Impact, 'Montserrat Black', 'Segoe UI Black', sans-serif" 
           font-weight="900" 
           font-size="86" 
           filter="url(#neonGlowLight)">+</tspan>
  </text>

  <text x="300" y="174" 
        text-anchor="middle" 
        font-family="'Montserrat', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-weight="800" 
        font-size="14" 
        letter-spacing="5.5px" 
        fill="#0891b2">PERFORMANCE &amp; ENGAJAMENTO</text>
</svg>