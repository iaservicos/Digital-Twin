<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 250" width="100%" height="100%">
  <defs>
    <linearGradient id="goldCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.8" />
    </linearGradient>

    <filter id="holoGlowC" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b1" />
      <feGaussianBlur stdDeviation="10" result="b2" />
      <feMerge>
        <feMergeNode in="b2" />
        <feMergeNode in="b1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Emblema de Patente Holográfica -->
  <g transform="translate(85, 115) scale(0.72)">
    <polygon points="0,-50 43,-25 43,25 0,50 -43,25 -43,-25" 
             fill="none" 
             stroke="url(#shieldBorder)" 
             stroke-width="3" 
             filter="url(#holoGlowC)" />
    <polygon points="0,-32 27,0 0,32 -27,0" 
             fill="#06b6d4" 
             fill-opacity="0.22" 
             stroke="#38bdf8" 
             stroke-width="2" />
    <circle cx="0" cy="0" r="5" fill="#f59e0b" filter="url(#holoGlowC)" />
  </g>

  <circle cx="505" cy="105" r="95" fill="#06b6d4" opacity="0.25" filter="url(#holoGlowC)" />

  <text x="345" y="130" text-anchor="middle">
    <tspan fill="#FFFFFF" 
           font-family="'Arial Black', 'Montserrat Black', Impact, sans-serif" 
           font-weight="900" 
           font-size="74" 
           letter-spacing="-0.04em">BRILHA</tspan>
    <tspan dx="10" dy="-2"
           fill="url(#goldCyanGrad)" 
           font-family="'Arial Black', 'Montserrat Black', Impact, sans-serif" 
           font-weight="900" 
           font-size="88" 
           filter="url(#holoGlowC)">+</tspan>
  </text>

  <!-- Pílula com largura ampla para acomodar todo o texto sem sobrepor -->
  <g transform="translate(345, 182)">
    <rect x="-190" y="-13" width="380" height="26" rx="13" fill="#06b6d4" fill-opacity="0.12" stroke="#38bdf8" stroke-width="1.2" />
    <text x="0" y="4" 
          text-anchor="middle" 
          font-family="'Montserrat', 'Inter', sans-serif" 
          font-weight="800" 
          font-size="11.5" 
          letter-spacing="3.5px" 
          fill="#38bdf8">★ PROGRAMA DE EXCELÊNCIA &amp; METAS ★</text>
  </g>
</svg>