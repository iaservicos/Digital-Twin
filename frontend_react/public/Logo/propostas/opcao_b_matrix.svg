<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 250" width="100%" height="100%">
  <defs>
    <linearGradient id="matrixGradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <filter id="glitchGlowB" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b1" />
      <feGaussianBlur stdDeviation="9" result="b2" />
      <feMerge>
        <feMergeNode in="b2" />
        <feMergeNode in="b1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g font-family="'Consolas', 'Courier New', monospace" font-size="10" fill="#06b6d4" opacity="0.22">
    <text x="50" y="50">01000010 01110010 01101001</text>
    <text x="50" y="70">11001010 00110001 01010011</text>
    <text x="50" y="210">01101100 01101000 01100001</text>
    <text x="390" y="50">10101010 00110010 11001100</text>
    <text x="390" y="210">00101011 01001101 01000001</text>
  </g>

  <circle cx="488" cy="105" r="90" fill="#06b6d4" opacity="0.18" filter="url(#glitchGlowB)" />

  <text x="325" y="130" text-anchor="middle">
    <tspan fill="#FFFFFF" 
           font-family="'Montserrat', 'Montserrat Black', sans-serif" 
           font-weight="900" 
           font-size="74" 
           letter-spacing="-0.03em">BRILHA</tspan>
    <tspan dx="10" dy="-2"
           fill="url(#matrixGradB)" 
           font-family="'Montserrat', 'Montserrat Black', sans-serif" 
           font-weight="900" 
           font-size="88" 
           filter="url(#glitchGlowB)">+</tspan>
  </text>

  <rect x="495" y="65" width="5" height="5" fill="#10b981" opacity="0.85" />
  <rect x="525" y="100" width="4" height="4" fill="#06b6d4" opacity="0.75" />
  <rect x="505" y="145" width="5" height="5" fill="#0284c7" opacity="0.8" />
  <rect x="455" y="75" width="4" height="4" fill="#10b981" opacity="0.7" />

  <text x="325" y="184" 
        text-anchor="middle" 
        font-family="'Consolas', 'Montserrat', monospace" 
        font-weight="800" 
        font-size="13.5" 
        letter-spacing="5px" 
        fill="#10b981">[ PERFORMANCE &amp; ENGAJAMENTO ]</text>
</svg>