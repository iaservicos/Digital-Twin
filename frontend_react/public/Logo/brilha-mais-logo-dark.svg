<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <defs>
    <!-- Fundo Deep Navy -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080e1a" />
      <stop offset="100%" stop-color="#0b1325" />
    </linearGradient>

    <!-- Grid Sutil -->
    <pattern id="gridPattern" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#16233b" stroke-width="0.75" opacity="0.7" />
    </pattern>

    
    <!-- Gradiente do Sinal de Mais -->
    <linearGradient id="plusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>

    <!-- Brilho Radial Traseiro em volta do + -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.5" />
      <stop offset="45%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="75%" stop-color="#0891b2" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0" />
    </radialGradient>

    <!-- Filtro Neon Glow Multi-Camadas -->
    <filter id="neonGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur2" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="22" result="blur3" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="35" result="blur4" />
      <feMerge>
        <feMergeNode in="blur4" />
        <feMergeNode in="blur3" />
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

  </defs>

  <rect width="600" height="240" fill="url(#bgGrad)" />
  <rect width="600" height="240" fill="url(#gridPattern)" />

  
  <!-- Brilho Halo atrás do sinal de + -->
  <circle cx="452" cy="100" r="105" fill="url(#ambientGlow)" />

  <!-- Texto Principal: BRILHA + perfeitamente alinhado e sem sobreposição -->
  <text x="300" y="125" text-anchor="middle">
    <tspan fill="#FFFFFF" 
           font-family="'Arial Black', Impact, 'Montserrat Black', 'Segoe UI Black', sans-serif" 
           font-weight="900" 
           font-size="74" 
           letter-spacing="-0.04em">BRILHA</tspan>
    <tspan dx="10" dy="-2"
           fill="url(#plusGrad)" 
           font-family="'Arial Black', Impact, 'Montserrat Black', 'Segoe UI Black', sans-serif" 
           font-weight="900" 
           font-size="86" 
           filter="url(#neonGlow)">+</tspan>
  </text>

  <!-- Subtítulo: PERFORMANCE & ENGAJAMENTO -->
  <text x="300" y="174" 
        text-anchor="middle" 
        font-family="'Montserrat', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-weight="800" 
        font-size="14" 
        letter-spacing="5.5px" 
        fill="#00bcd4">PERFORMANCE &amp; ENGAJAMENTO</text>

</svg>