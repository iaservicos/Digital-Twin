# Render Blueprint (Infrastructure as Code) para Plataforma Digital Twin
services:
  # -------------------------------------------------------------
  # 1. FRONTEND REACT (Static Site com CDN e SSL Automático)
  # -------------------------------------------------------------
  - type: web
    name: digitaltwin-frontend
    runtime: static
    rootDir: frontend_react
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_API_URL
        value: https://digitaltwin-backend.onrender.com/api/v1
      - key: VITE_DATA_INGEST_URL
        value: https://digitaltwin-dataingest.onrender.com

  # -------------------------------------------------------------
  # 2. BACKEND PYTHON (FastAPI / Python 3.12)
  # -------------------------------------------------------------
  - type: web
    name: digitaltwin-backend
    runtime: docker
    rootDir: backend_python
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        value: 5432
      - key: POSTGRES_DB
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_SCHEMA
        value: public
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_INGEST_URL
        value: https://digitaltwin-dataingest.onrender.com
      - key: DATA_INGEST_API_KEY
        value: pos-data-token-2026

  # -------------------------------------------------------------
  # 3. DATA INGEST (Python 3.12 / FastAPI / Polars Engine)
  # -------------------------------------------------------------
  - type: web
    name: digitaltwin-dataingest
    runtime: docker
    rootDir: DataIngest
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        sync: false
      - key: DATABRICKS_SERVER_HOSTNAME
        sync: false
      - key: DATABRICKS_HTTP_PATH
        sync: false
      - key: DATABRICKS_TOKEN
        sync: false
      - key: DATA_INGEST_API_KEY
        value: pos-data-token-2026
