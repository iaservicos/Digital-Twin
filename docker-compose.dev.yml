services:
  # --- 1. MICROSERVIÇO DE INGESTÃO DATABRICKS (MODO DEV) ---
  data_ingest:
    build:
      context: ./DataIngest
      dockerfile: Dockerfile
    container_name: digitaltwin_data_ingest_dev
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "8000:8000"
    volumes:
      - ./DataIngest:/app
    env_file:
      - .env
    networks:
      - digitaltwin_network

  # --- 2. BACKEND DE NEGÓCIO (PYTHON FASTAPI MODO DEV) ---
  backend:
    build:
      context: ./backend_python
      dockerfile: Dockerfile.dev
    container_name: digitaltwin_backend_dev
    restart: on-failure
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "8080:8080"
    volumes:
      - ./backend_python:/app/backend_python
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - digitaltwin_network

  # --- 3. FRONTEND WEB (REACT TYPESCRIPT VITE MODO DEV) ---
  frontend:
    build:
      context: ./frontend_react
      dockerfile: dockerfile
    container_name: digitaltwin_frontend_dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend_react:/app
      - /app/node_modules
    depends_on:
      - backend
      - data_ingest
    networks:
      - digitaltwin_network

networks:
  digitaltwin_network:
    driver: bridge

