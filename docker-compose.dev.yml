services:
  # --- 1. MICROSERVIÇO DE INGESTÃO DATABRICKS (MODO DEV) ---
  data_ingest:
    build:
      context: ./DataIngest
      dockerfile: Dockerfile
    container_name: digitaltwin_data_ingest_dev
    ports:
      - "8000:8000"
    volumes:
      - ./DataIngest:/app
    env_file:
      - .env
    networks:
      - digitaltwin_network

  # --- 2. BACKEND DE NEGÓCIO (SPRING BOOT 3 MODO DEV) ---
  backend:
    build:
      context: ./backend_java
      dockerfile: Dockerfile.dev
    container_name: digitaltwin_backend_dev
    ports:
      - "8080:8080"
    volumes:
      - ./backend_java:/app
    env_file:
      - .env
    environment:
      - SPRING_FLYWAY_BASELINE_ON_MIGRATE=true
      - SPRING_FLYWAY_VALIDATE_ON_MIGRATE=false
      - SPRING_FLYWAY_IGNORE_MIGRATION_PATTERNS=*:missing
      - SPRING_FLYWAY_SCHEMAS=public
      - SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA=public
    networks:
      - digitaltwin_network

  # --- 3. FRONTEND WEB (REACT TYPESCRIPT VITE MODO DEV) ---
  frontend:
    build:
      context: ./frontend_react
      dockerfile: dockerfile
    container_name: digitaltwin_frontend_dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend_react:/app
      - /app/node_modules
    depends_on:
      - backend
      - data_ingest
    networks:
      - digitaltwin_network

networks:
  digitaltwin_network:
    driver: bridge
